<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>House of Imbibe</title>
  <style>
    :root { --ink: #e8dcc8; --bg: #14100e; --panel: #241c16; --accent: #d4a24e; }
    * { box-sizing: border-box; image-rendering: pixelated; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: "Courier New", ui-monospace, monospace; overflow: hidden; }
    #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #game { position: relative; }
    canvas { display: block; }

    /* DOM overlay 层（登录 / 形象创建 / 酒单） */
    .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(10, 8, 6, 0.72); z-index: 10; }
    .panel { background: var(--panel); border: 4px solid #4a3826; box-shadow: 0 0 0 4px #14100e;
      padding: 20px 24px; min-width: 260px; max-width: 92vw; max-height: 88vh; overflow: auto; }
    .panel h1 { font-size: 18px; margin: 0 0 4px; color: var(--accent); letter-spacing: 2px; }
    .panel h2 { font-size: 12px; margin: 0 0 16px; color: #9a8a70; font-weight: normal; }
    .panel label { display: block; font-size: 12px; margin: 10px 0 4px; color: #c8b898; }
    .panel input { width: 100%; padding: 8px; background: #14100e; color: var(--ink);
      border: 2px solid #4a3826; font: inherit; outline: none; }
    .panel input:focus { border-color: var(--accent); }
    .btn { display: block; width: 100%; margin-top: 14px; padding: 10px; background: var(--accent);
      color: #1a1208; border: 0; font: inherit; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
    .btn:active { transform: translateY(2px); }
    .btn.ghost { background: transparent; border: 2px solid #4a3826; color: #c8b898; }
    .err { color: #e06c5a; font-size: 12px; min-height: 16px; margin-top: 8px; }
    .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
    .swatch { width: 26px; height: 26px; border: 2px solid #14100e; cursor: pointer; }
    .swatch.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
    .hint { font-size: 11px; color: #8a7a60; margin-top: 12px; }
    /* 形象创建：上传 + 进度 + 预览 */
    .avatar-panel { max-width: 340px; }
    .av-upload { border: 2px dashed #4a3826; padding: 20px; text-align: center; cursor: pointer;
      margin-bottom: 12px; transition: border-color 0.15s, background 0.15s; }
    .av-upload:hover { border-color: var(--accent); background: rgba(212,162,78,0.06); }
    .av-upload.dragover { border-color: var(--accent); background: rgba(212,162,78,0.12); }
    .av-upload input { display: none; }
    .av-upload-hint { font-size: 13px; color: #c8b898; }
    .av-upload-file { font-size: 11px; color: #9a8a70; margin-top: 6px; word-break: break-all; }
    .av-progress { margin: 12px 0; }
    .av-progress-bar { background: #14100e; height: 8px; border: 1px solid #4a3826; }
    .av-progress-fill { background: var(--accent); height: 100%; width: 0%; transition: width 1s; }
    .av-progress-text { font-size: 12px; color: #c8b898; margin-top: 6px; }
    .av-preview { margin: 12px 0; }
    .av-preview-label { font-size: 12px; color: #c8b898; margin-bottom: 8px; }
    .av-preview-dirs { display: flex; gap: 8px; justify-content: center; }
    .av-dir-cell { text-align: center; }
    .av-dir-cell img { width: 64px; height: 64px; image-rendering: pixelated; border: 2px solid #4a3826;
      background: #14100e; display: block; }
    .av-dir-label { font-size: 10px; color: #9a8a70; margin-top: 2px; }
    .menu-item { padding: 8px 0; border-bottom: 1px dashed #4a3826; }
    .menu-item .name { color: var(--ink); }
    .menu-item .desc { font-size: 11px; color: #9a8a70; }
    .menu-item .price { float: right; color: var(--accent); }
    .menu-section { color: var(--accent); font-size: 13px; letter-spacing: 2px; margin: 14px 0 4px; }
    #hud { position: absolute; top: 6px; right: 8px; z-index: 5; font-size: 11px; display: none; }
    #hud a { color: #9a8a70; cursor: pointer; text-decoration: none; margin-left: 10px; }
    #hud a:hover { color: var(--accent); }
    #toast { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 6;
      background: rgba(20,16,14,.85); border: 2px solid #4a3826; padding: 4px 12px; font-size: 12px;
      display: none; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="app">
    <div id="game">
      <div id="hud"><span id="hud-user"></span><a id="hud-edit">换装</a><a id="hud-logout">离开</a></div>
      <div id="toast"></div>
      <div id="ui"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
