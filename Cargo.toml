[package]
name = "house-of-imbibe"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
# rand_core 0.6 的 `getrandom` feature 必须显式打开才能用 `OsRng`。
# password-hash / argon2 默认只开 `rand_core` feature，不开 `getrandom`，导致 src/main.rs 找不到 `OsRng`。
# 加 `getrandom = "0.2"` 也救不了——因为 reqwest 拉进来的 getrandom 0.3 会覆盖版本解析。
# 因此直接对 rand_core 0.6 锁定 feature 最稳。
rand_core = { version = "0.6", features = ["getrandom"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 仅 image2pixel 二进制使用
# 注意：不能用 default-features = false，否则会破坏 argon2 的 OsRng feature 解析
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
